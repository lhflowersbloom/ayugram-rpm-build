name: Build AyuGram Desktop RPM

# Compiles AyuGram Desktop from upstream sources and publishes a Fedora .rpm.
#
# Triggers:
#   - schedule: once a day, build only if upstream released a version we have
#               not packaged yet
#   - workflow_dispatch: force a build (leave "ref" empty for the latest
#               upstream release tag)
#
# NOTE: deliberately no `push: tags` trigger. The release step creates
# `build-<ver>-<run>` tags, which would re-trigger the workflow forever.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream git ref (empty = latest release tag)"
        required: false
        default: ""
  schedule:
    - cron: "0 20 * * *"   # 20:00 UTC = 04:00 Asia/Shanghai

permissions:
  contents: write

concurrency:
  # a second build would fight over 4 cores and RAM during linking
  group: ayugram-rpm
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/AyuGram/AyuGramDesktop.git
  API_ID: "2040"
  API_HASH: b18441a1ff607e10a989891a5462e627

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.q.outputs.version }}
      ref: ${{ steps.q.outputs.ref }}
      build: ${{ steps.q.outputs.build }}
    steps:
      - name: Look for an unbuilt upstream release
        id: q
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(gh api repos/AyuGram/AyuGramDesktop/releases/latest --jq .tag_name)
          VER="${TAG#v}"
          echo "latest upstream: $TAG ($VER)"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "ref=$TAG" >> "$GITHUB_OUTPUT"

          # our own releases are tagged build-<version>-<run number>
          BUILT=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                    --jq '.[].tag_name' 2>/dev/null \
                  | grep -cE "^build-${VER//./\\.}-[0-9]+$" || true)
          if [ "${BUILT:-0}" -gt 0 ]; then
            echo "$VER already packaged ($BUILT build(s)) — nothing to do"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "$VER not packaged yet — will build"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: github.event_name == 'workflow_dispatch' || needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Resolve upstream ref
        id: ref
        run: |
          REF="${{ inputs.ref }}"
          [ -n "$REF" ] || REF="${{ needs.check.outputs.ref }}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "building ref: $REF"

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: false
          swap-storage: false

      - name: Show resources
        run: |
          nproc; free -g; df -h /

      - name: Clone upstream with submodules
        run: |
          REF="${{ steps.ref.outputs.ref }}"
          # full clone: shallow clones of this repo break submodules pinned to
          # commits that are not the branch tip ("reference is not a tree")
          git clone --recursive --jobs 8 --branch "$REF" "$UPSTREAM" tdesktop
          cd tdesktop
          git log -1 --format='%H %ad %s'
          git submodule status --recursive | head -30

      - name: Build tlottie static lib
        # The published centos_env image ships tlottie.h but no libtlottie.a
        # (its build history has no tlottie stage), so AyuGram's tree cannot
        # configure against it. Rebuild the lib exactly as the Dockerfile does.
        run: |
          mkdir -p lottie
          IMG=rust:1.96.1
          docker pull -q "$IMG" || IMG=rust:latest
          echo "using $IMG"
          docker run --rm -v "$PWD/lottie:/out" -w /src "$IMG" bash -eo pipefail -c '
            apt-get update -qq && apt-get install -y -qq git curl binutils >/dev/null
            curl -sSLo /src/tlottie.patch https://raw.githubusercontent.com/desktop-app/patches/519aaa084608fa6f9a2bfbd1959d133c44d94227/tlottie.patch
            git init t && cd t
            git remote add origin https://github.com/dkaraush/tlottie.git
            git fetch --depth=1 origin 31f1b542f88e7b4be9a01e749920d857535fc715
            git reset --hard FETCH_HEAD
            git apply /src/tlottie.patch
            cargo rustc --lib --release --locked --features c-api \
                        --crate-type staticlib --target x86_64-unknown-linux-gnu
            objcopy --strip-debug target/x86_64-unknown-linux-gnu/release/libtlottie.a /out/libtlottie.a
            mkdir -p /out/include && cp include/tlottie.h /out/include/
          '
          ls -lh lottie/

      - name: Build (centos_env image, same as upstream docs)
        working-directory: tdesktop
        run: |
          docker run --rm -u 0 \
            -v "$PWD:/usr/src/tdesktop" \
            -v "$PWD/../lottie:/usr/src/lottie" \
            -e CONFIG=Release \
            -e API_ID="$API_ID" \
            -e API_HASH="$API_HASH" \
            -e CMAKE_BUILD_PARALLEL_LEVEL=$(nproc) \
            ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
            bash -lc '
              set -e
              install -D -m0644 /usr/src/lottie/libtlottie.a /usr/local/lib/libtlottie.a
              install -D -m0644 /usr/src/lottie/include/tlottie.h /usr/local/include/tlottie/tlottie.h
              exec /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
                -D TDESKTOP_API_ID=$API_ID \
                -D TDESKTOP_API_HASH=$API_HASH
            '
          ls -lh out/Release/AyuGram
          file out/Release/AyuGram

      - name: Upload raw binary
        # Keep the compiled binary before packaging: a packaging bug must not
        # throw away a two hour build.
        run: |
          VERSION=$(sed -n 's/^AppVersionStrSmall[[:space:]]*//p' tdesktop/Telegram/build/version | tr -d '[:space:]')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          strip --strip-unneeded tdesktop/out/Release/AyuGram
          cp tdesktop/out/Release/AyuGram dist/AyuGram
          tar -C dist -czf "dist/AyuGram-${VERSION}-linux-x86_64.tar.gz" AyuGram
          ls -lh dist/
        continue-on-error: true

      - name: Save the binary as an artifact (before any packaging step)
        uses: actions/upload-artifact@v4
        with:
          name: ayugram-binary-${{ env.VERSION }}
          path: dist/*.tar.gz
          retention-days: 14
          if-no-files-found: warn

      - name: Package RPM
        run: |
          mkdir -p dist
          VERSION="${VERSION:-$(sed -n 's/^AppVersionStrSmall[[:space:]]*//p' tdesktop/Telegram/build/version | tr -d '[:space:]')}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          # Everything the spec needs, staged outside the container.
          mkdir -p stage
          install -m 755 tdesktop/out/Release/AyuGram stage/AyuGram
          cp tdesktop/lib/xdg/com.ayugram.desktop.desktop stage/
          cp tdesktop/lib/xdg/com.ayugram.desktop.metainfo.xml stage/
          sed 's|@CMAKE_INSTALL_FULL_BINDIR@|/usr/bin|' \
              tdesktop/lib/xdg/com.ayugram.desktop.service > stage/com.ayugram.desktop.service
          for sz in 16 32 48 64 128 256 512; do
            cp "tdesktop/Telegram/Resources/art/icon${sz}.png" stage/
          done
          tar -C stage -czf stage.tgz .
          ls -lh stage.tgz

          docker run --rm -u 0 -e VERSION="$VERSION" -v "$PWD:/w" -w /w fedora:latest bash -lc '
            set -euo pipefail
            dnf -y -q install rpm-build binutils >/dev/null
            # rpmbuild resolves %{SOURCESx} under <topdir>/SOURCES (uppercase)
            mkdir -p /tmp/r/SOURCES /tmp/r/BUILD /tmp/r/RPMS /tmp/r/BUILDROOT /tmp/r/SPECS
            tar -C /tmp/r/SOURCES -xzf /w/stage.tgz
            cd /tmp/r/SOURCES

            # strip before packaging: brp-strip would need a full toolchain
            strip --strip-unneeded AyuGram
            REQ=""
            for s in $(ldd AyuGram | awk "/=>/ {print \$1}" | sort -u); do
              case "$s" in
                libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*|libmvec.so.*|libresolv.so.*|libutil.so.*) continue ;;
              esac
              REQ="${REQ}Requires:       ${s}\n"
            done

            cat > /tmp/r/SPECS/ayugram-desktop.spec <<SPEC
          Name:           ayugram-desktop
          Version:        ${VERSION}
          Release:        1%{?dist}
          Summary:        AyuGram Desktop - Telegram Desktop fork with Ghost mode
          License:        GPL-3.0-or-later
          URL:            https://github.com/AyuGram/AyuGramDesktop
          Source0:        AyuGram
          Source1:        com.ayugram.desktop.desktop
          Source2:        com.ayugram.desktop.metainfo.xml
          Source3:        com.ayugram.desktop.service
          Source4:        icon16.png
          Source5:        icon32.png
          Source6:        icon48.png
          Source7:        icon64.png
          Source8:        icon128.png
          Source9:        icon256.png
          Source10:       icon512.png
          BuildArch:      x86_64
          AutoReqProv:    no
          $(printf "%b" "$REQ")
          Requires:       glibc >= 2.28

          %description
          AyuGram Desktop is an unofficial Telegram Desktop fork with Ghost mode,
          anti-recall and extended customisation. Linux build.

          %prep
          %build
          %install
          umask 022
          install -d %{buildroot}%{_bindir} %{buildroot}%{_datadir}/applications \
                     %{buildroot}%{_datadir}/metainfo %{buildroot}%{_datadir}/dbus-1/services
          for d in 16x16 32x32 48x48 64x64 128x128 256x256 512x512; do
            install -d %{buildroot}%{_datadir}/icons/hicolor/\$d/apps
          done
          install -m 0755 %{SOURCE0} %{buildroot}%{_bindir}/AyuGram
          install -m 0644 %{SOURCE1} %{buildroot}%{_datadir}/applications/
          install -m 0644 %{SOURCE2} %{buildroot}%{_datadir}/metainfo/
          install -m 0644 %{SOURCE3} %{buildroot}%{_datadir}/dbus-1/services/
          install -m 0644 %{SOURCE4} %{buildroot}%{_datadir}/icons/hicolor/16x16/apps/com.ayugram.desktop.png
          install -m 0644 %{SOURCE5} %{buildroot}%{_datadir}/icons/hicolor/32x32/apps/com.ayugram.desktop.png
          install -m 0644 %{SOURCE6} %{buildroot}%{_datadir}/icons/hicolor/48x48/apps/com.ayugram.desktop.png
          install -m 0644 %{SOURCE7} %{buildroot}%{_datadir}/icons/hicolor/64x64/apps/com.ayugram.desktop.png
          install -m 0644 %{SOURCE8} %{buildroot}%{_datadir}/icons/hicolor/128x128/apps/com.ayugram.desktop.png
          install -m 0644 %{SOURCE9} %{buildroot}%{_datadir}/icons/hicolor/256x256/apps/com.ayugram.desktop.png
          install -m 0644 %{SOURCE10} %{buildroot}%{_datadir}/icons/hicolor/512x512/apps/com.ayugram.desktop.png

          %post
          [ -x /usr/bin/gtk-update-icon-cache ] && /usr/bin/gtk-update-icon-cache -q -t -f %{_datadir}/icons/hicolor 2>/dev/null || :
          [ -x /usr/bin/update-desktop-database ] && /usr/bin/update-desktop-database -q %{_datadir}/applications 2>/dev/null || :

          %postun
          [ -x /usr/bin/gtk-update-icon-cache ] && /usr/bin/gtk-update-icon-cache -q -t -f %{_datadir}/icons/hicolor 2>/dev/null || :

          %files
          %{_bindir}/AyuGram
          %{_datadir}/applications/com.ayugram.desktop.desktop
          %{_datadir}/metainfo/com.ayugram.desktop.metainfo.xml
          %{_datadir}/dbus-1/services/com.ayugram.desktop.service
          %{_datadir}/icons/hicolor/*/apps/com.ayugram.desktop.png

          %changelog
          * Thu Nov 05 2026 CI <ci@localhost> - ${VERSION}-1
          - Built from upstream sources
          SPEC
            rpmbuild -bb --define "_topdir /tmp/r" --define "debug_package %{nil}" \
                     /tmp/r/SPECS/ayugram-desktop.spec
            cp /tmp/r/RPMS/x86_64/*.rpm /w/dist/
          '
          ls -lh dist/

      - name: Smoke test the package
        # Real install in a clean Fedora container: dnf has to resolve every
        # soname requirement, and the binary has to link once installed.
        run: |
          docker run --rm -v "$PWD/dist:/d:ro" -w /d fedora:latest bash -lc '
            set -euo pipefail
            RPM=$(ls *.rpm)
            echo "--- info ---";    rpm -qpi "$RPM" | head -12
            echo "--- requires ---"; rpm -qp --requires "$RPM" | grep -v "^rpmlib"
            echo "--- files ---";   rpm -qplv "$RPM"
            echo "--- install ---"
            dnf -y -q install "./$RPM"
            test -x /usr/bin/AyuGram
            if ldd /usr/bin/AyuGram | grep "not found"; then
              echo "unresolved libraries"; exit 1
            fi
            /usr/bin/AyuGram -version 2>/dev/null || true
            echo "install + link OK"
          '

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayugram-desktop-rpm-${{ env.VERSION }}
          path: |
            dist/*.rpm
            dist/*.tar.gz
          retention-days: 14

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ env.VERSION }}-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/*.rpm dist/AyuGram-*.tar.gz \
            --title "AyuGram Desktop ${VERSION} RPM" \
            --notes "Built from upstream \`${{ steps.ref.outputs.ref }}\` on $(date -u +%F)." \
            --repo "$GITHUB_REPOSITORY"
          echo "RELEASE_URL=https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_ENV"

      - name: Summary
        run: |
          {
            echo "### AyuGram Desktop $VERSION"
            echo ""
            echo "- upstream ref: \`${{ steps.ref.outputs.ref }}\`"
            echo "- release: $RELEASE_URL"
            echo "- artifact: \`ayugram-desktop-${VERSION}-1.fc45.x86_64.rpm\`"
          } >> "$GITHUB_STEP_SUMMARY"
